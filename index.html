<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Interactive simulator of the Ricart–Agrawala distributed mutual exclusion algorithm." />
    <title>Distributed Mutual Exclusion Simulator</title>
    <script>
      /* Apply the saved theme before first paint to avoid a flash of the wrong theme. */
      (function () {
        var theme = 'dark';
        try {
          var stored = window.localStorage.getItem('distributed-mutex-theme');
          if (stored === 'light' || stored === 'dark') theme = stored;
        } catch (e) { /* storage blocked: keep default dark */ }
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
